name: build

# Travelsats fork: upstream builds amd64 + arm64 and publishes only :latest on
# every push. Compiling strfry twice for an unused architecture doubles a slow
# C++ build, and an unversioned tag makes it impossible to say what is running
# or to roll back. This builds amd64 only, on tags, and publishes a versioned
# tag alongside :latest.
#
# Fly deploys from the local Dockerfile via `fly deploy` and does not consume
# this image; it exists for the Coolify deployment.
on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Resolve image name and version
        id: meta
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          image="ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Build and push
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:latest" \
            --push .

      - name: Verify image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
